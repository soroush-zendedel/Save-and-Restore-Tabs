<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Save and Restore Tabs</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Tab Links</h1>
      <p>Save open web tab links to a text file or restore them from a file.</p>
      <button id="save" type="button">Save open tab links</button>
      <button id="load" class="secondary" type="button">Load a file and reopen tabs</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
